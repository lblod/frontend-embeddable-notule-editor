steps:
  install:
    image: node:22-slim
    commands:
      - corepack enable
      - pnpm i --frozen-lockfile
  lint-types:
    image: node:22-slim
    group: lint
    commands:
      - corepack enable
      - pnpm lint:types
  lint-js:
    image: node:22-slim
    group: lint
    commands:
      - corepack enable
      - pnpm lint:js
  lint-hbs:
    image: node:22-slim
    group: lint
    commands:
      - corepack enable
      - pnpm lint:hbs
  dependency-lint:
    image: node:22-slim
    group: lint
    commands:
      - corepack enable
      - pnpm lint:dependencies
  test-angular:
    image: plugins/docker
    settings:
      repo: lblod/frontend-embeddable-notule-editor
      dockerfile: test-angular/Dockerfile
      dry_run: true
    when:
      path:
        include:
          [
            "test-angular/*",
            "embeddable-say-editor/types/*",
            "embeddable-say-editor/typeImports/*",
            "embeddable-say-editor/package.json",
          ]
        ignore_message: "[ALL]"

when:
  event:
    - pull_request
